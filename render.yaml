services:
  - type: web
    name: ai-social-media-agent-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLISH_MODE
        value: demo
      - key: FRONTEND_ORIGIN
        value: https://ai-social-media-agent-ui.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: USE_POSTGRES_CHECKPOINTER
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////var/data/social_agent.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://ai-social-media-agent-api.onrender.com/auth/linkedin/callback
      - key: LINKEDIN_VERSION
        value: "202606"
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_ALLOWED_USER_IDS
        sync: false
    disk:
      name: ai-social-media-agent-data
      mountPath: /var/data
      sizeGB: 1
