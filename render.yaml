services:
  - type: web
    name: ai-social-media-agent-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLISH_MODE
        value: demo
      - key: FRONTEND_ORIGIN
        value: https://ai-social-media-agent-ui.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-social-media-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-social-media-agent-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://ai-social-media-agent-api.onrender.com/auth/linkedin/callback
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_ALLOWED_USER_IDS
        sync: false
      - key: USE_POSTGRES_CHECKPOINTER
        value: "true"

  - type: keyvalue
    name: ai-social-media-agent-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: ai-social-media-agent-ui
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-social-media-agent-api.onrender.com

databases:
  - name: ai-social-media-agent-db
    plan: free
    region: singapore
    databaseName: socialagent
    user: socialagent
